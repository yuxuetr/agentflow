models:
  # 2026-08-13: per api-docs.deepseek.com's pricing/model page, deepseek-chat
  # and deepseek-reasoner no longer appear in DeepSeek's current model
  # catalog — deepseek-chat's deprecation (announced for 2026-07-24, per
  # provider_consistency_live.rs's DeepSeek live-test comments) has passed as
  # of this writing. Kept in the registry (not deleted) so existing configs
  # referencing them by name don't silently break, but new integrations
  # should target deepseek-v4-flash / deepseek-v4-pro below.
  deepseek-chat:
    vendor: deepseek
    type: chat
    model_id: null
    base_url: null
    temperature: 0.7
    top_p: null
    max_tokens: 8192
    frequency_penalty: null
    stop: null
    n: null
    supports_streaming: true
    supports_tools: true
    native_tool_calling: true
    supports_multimodal: false
    response_format: null
  deepseek-reasoner:
    vendor: deepseek
    type: chat
    model_id: null
    base_url: null
    temperature: 0.7
    top_p: null
    max_tokens: 8192
    frequency_penalty: null
    stop: null
    n: null
    supports_streaming: true
    supports_tools: true
    native_tool_calling: true
    supports_multimodal: false
    supports_thinking: true
    thinking_kind: output_only
    response_format: null
  deepseek-v4-flash:
    vendor: deepseek
    type: chat
    model_id: null
    base_url: null
    temperature: 0.7
    top_p: null
    max_tokens: 8192
    frequency_penalty: null
    stop: null
    n: null
    supports_streaming: true
    supports_tools: true
    native_tool_calling: true
    supports_multimodal: false
    # V4-Flash-0731. Both current DeepSeek models support thinking mode via
    # the nested `thinking: {type, reasoning_effort}` request block (see
    # `ThinkingKind::DeepSeekReasoningEffort`) — unlike legacy
    # deepseek-reasoner above, this is a real caller-facing input knob, not
    # output-only.
    supports_thinking: true
    thinking_kind: deep_seek_reasoning_effort
    response_format: null
  deepseek-v4-pro:
    vendor: deepseek
    type: chat
    model_id: null
    base_url: null
    temperature: 0.7
    top_p: null
    max_tokens: 8192
    frequency_penalty: null
    stop: null
    n: null
    supports_streaming: true
    supports_tools: true
    native_tool_calling: true
    supports_multimodal: false
    # V4-Pro-0813. See deepseek-v4-flash's comment above.
    supports_thinking: true
    thinking_kind: deep_seek_reasoning_effort
    response_format: null
