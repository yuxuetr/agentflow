[package]
name = "agentflow-db"
version = "0.1.0"
description = "Database persistence and models for the AgentFlow Gateway"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
agentflow-agent-spi = { path = "../agentflow-agent-spi", version = "0.1" }
sqlx = { workspace = true, features = ["macros", "migrate", "uuid", "chrono", "json"] }
tokio = { workspace = true, features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { workspace = true, features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
