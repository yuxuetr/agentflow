name: Debug Sandbox Probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Environment facts
        run: |
          uname -a
          id
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1 || echo "no such sysctl"
          cat /proc/sys/kernel/unprivileged_bpf_disabled 2>&1 || echo "no such sysctl"
          cat /proc/sys/kernel/yama/ptrace_scope 2>&1 || echo "no such sysctl"
          which aa-status && sudo aa-status 2>&1 | head -30 || echo "no aa-status"
          cat /proc/self/status | grep -i seccomp
          cat /proc/self/status | grep -i cap
          python3 --version
      - uses: dtolnay/rust-toolchain@stable
      - name: Minimal seccomp probe (no landlock, no cgroup)
        run: |
          cat > /tmp/probe.rs << 'EOF'
          use std::process::Command;
          use std::os::unix::process::CommandExt;
          fn main() {
            let mut cmd = Command::new("echo");
            cmd.arg("hello-from-probe");
            unsafe {
              cmd.pre_exec(|| {
                let rc = libc::syscall(libc::SYS_prctl, libc::PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0);
                if rc != 0 {
                  return Err(std::io::Error::last_os_error());
                }
                eprintln!("PR_SET_NO_NEW_PRIVS ok");
                Ok(())
              });
            }
            match cmd.output() {
              Ok(out) => {
                eprintln!("spawn ok, status={:?}", out.status);
                eprintln!("stdout={}", String::from_utf8_lossy(&out.stdout));
                eprintln!("stderr={}", String::from_utf8_lossy(&out.stderr));
              }
              Err(e) => eprintln!("spawn FAILED: {e:?}"),
            }
          }
          EOF
          mkdir -p /tmp/probe_crate/src
          mv /tmp/probe.rs /tmp/probe_crate/src/main.rs
          cat > /tmp/probe_crate/Cargo.toml << 'EOF'
          [package]
          name = "probe"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          libc = "0.2"
          EOF
          cd /tmp/probe_crate && cargo run 2>&1
      - name: Run the real failing test with backtrace
        run: |
          cd "$GITHUB_WORKSPACE"
          RUST_BACKTRACE=full cargo test -p agentflow-tools --test sandbox_linux -- --test-threads=1 --nocapture 2>&1 | tail -150
