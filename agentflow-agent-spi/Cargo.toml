[package]
name = "agentflow-agent-spi"
version = "0.1.0"
description = "Agent runtime contracts for AgentFlow — AgentRuntime, AgentEvent, AgentStep, AgentContext"
keywords = ["ai", "agents", "runtime"]
categories = ["data-structures"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
agentflow-value = { path = "../agentflow-value", version = "0.1" }
agentflow-store-spi = { path = "../agentflow-store-spi", version = "0.1" }
# T3.3: contract-only usage (Tool/ToolRegistry/Capability/SandboxStatus) —
# depends on the contract crate directly, not the builtin-impl one.
agentflow-tool = { path = "../agentflow-tool", version = "0.1" }
async-trait = "0.1"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { workspace = true, features = ["sync"] }
# L5.1: DelegationSpec::expected_output_schema validation.
jsonschema = "0.17"
