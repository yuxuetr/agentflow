[package]
name = "agentflow-server"
version = "0.1.0"
description = "Axum-based Gateway server for AgentFlow"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# P-A2.3: the worker.proto codegen + `pb` module moved to
# `agentflow-worker-proto`; this crate consumes the generated messages from
# there and keeps only the hand-written tower `Service` + `WorkerControl` trait.

[dependencies]
axum = "0.7"
tokio = { workspace = true, features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-trait = "0.1"
futures = "0.3"
uuid = { workspace = true, features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = { version = "0.1", features = ["sync"] }
dirs = "5.0"
prost = "0.13"
# T1.2: explicit `tls`/`tls-roots` for the worker gRPC control-plane
# listener's `ServerTlsConfig` — see the matching comment in
# agentflow-worker-proto/Cargo.toml for why this must not be incidental.
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
sqlx = { workspace = true, features = ["chrono", "uuid"] }
# P10.16.1: signed-JWT worker admission. HS256 (single shared secret) + RS256
# (asymmetric — operator-signed, worker-verifying — for the production IdP path).
jsonwebtoken = "9.3"
# P10.14.2-FU1: Prometheus `/metrics` endpoint emission. `metrics` is the
# facade (fire-and-forget `counter!()` / `histogram!()` macros from any
# production code path); `metrics-exporter-prometheus` provides the
# recorder that aggregates them into the Prometheus text format the
# Grafana dashboards (`dashboards/grafana/agentflow-overview.json`)
# expect to scrape.
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }

# Workspace dependencies
agentflow-db = { path = "../agentflow-db", version = "0.1" }
agentflow-core = { path = "../agentflow-core", version = "0.2" }
agentflow-worker-proto = { path = "../agentflow-worker-proto", version = "0.1" }
# Workflow assembly (config schema + YAML -> Flow) + diagnostics report builder,
# shared with the CLI. Mirrors the CLI's default capability features so
# server-assembled workflows support the same node types. P-A2.4 moved the last
# server->cli usage (the doctor `build_report`) here, so the server no longer
# depends on the CLI binary crate at all.
agentflow-config = { path = "../agentflow-config", version = "0.1", features = ["plugin", "rag"] }
agentflow-skills = { path = "../agentflow-skills", version = "0.1" }
agentflow-tracing = { path = "../agentflow-tracing", version = "0.1" }
agentflow-tools = { path = "../agentflow-tools", version = "0.1" }
agentflow-harness = { path = "../agentflow-harness", version = "0.1" }
agentflow-agents = { path = "../agentflow-agents", version = "0.2" }
agentflow-agent-spi = { path = "../agentflow-agent-spi", version = "0.1" }
agentflow-llm = { path = "../agentflow-llm", version = "0.2" }
agentflow-memory = { path = "../agentflow-memory", version = "0.1" }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
sqlx = { workspace = true }
futures = "0.3"
tempfile = "3"
urlencoding = "2"
# Q2.3.4 sweep_trace_dir test needs to backdate file mtime.
filetime = "0.2"
# W4.3b-d: end-to-end distributed-run test needs a real WorkerRuntime
# driving genuine node payload execution against a real gRPC-bound
# control plane, not just raw protocol calls. `agentflow-worker`
# already dev-depends on `agentflow-server` the other way (its own T1.2
# TLS e2e test) — a dev-dependency cycle is fine in Cargo since dev-deps
# never enter the normal build graph either crate exposes to consumers.
agentflow-worker = { path = "../agentflow-worker", version = "0.1" }
