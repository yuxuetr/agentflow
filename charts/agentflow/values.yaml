# U1.2: AGENTFLOW_SECURITY_PROFILE for the gateway process. Defaults to
# `local` so existing installs keep their current (permissive) behavior
# on `helm upgrade`.
#
# PRODUCTION DEPLOYMENTS MUST SET THIS TO `production` EXPLICITLY
# (`--set securityProfile=production`), otherwise:
#   - a missing bearer token does NOT fail startup — the gateway just
#     starts open with no auth (a warning is logged, but that's easy
#     to miss). Setting env.AGENTFLOW_API_TOKEN still enforces it under
#     `local` too; this chart has no dedicated secret wiring for the
#     token yet — see docs/DEPLOYMENT.md § Security profile;
#   - CORS stays permissive instead of an explicit origin allow-list;
#   - if you also enable a worker gRPC control plane, worker admission
#     policy is NOT fail-closed under `local`.
# See docs/DEPLOYMENT.md § Security profile and docs/SECURITY_PROFILES.md
# for the full defaults table.
securityProfile: local

replicaCount: 1

image:
  repository: agentflow
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

containerPort: 3000

env:
  RUST_LOG: info
  PORT: "3000"

secretEnv:
  DATABASE_URL: ""

existingSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# HPA is opt-in (enabled: false) to preserve the prior single-replica
# behavior for existing installs; enabling it ignores replicaCount.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# U3.2: PodDisruptionBudget, opt-in (enabled: false) — like autoscaling
# above, and for the same single-replica-by-default reason: with
# replicaCount: 1, a PDB requiring minAvailable: 1 blocks voluntary
# eviction entirely (node drains for maintenance/upgrades would stall
# waiting for a PDB that can never be satisfied while giving up the
# only replica). Only enable this for deployments actually running
# more than one replica (replicaCount > 1, or autoscaling.enabled with
# minReplicas > 1) — see docs/DEPLOYMENT.md § PodDisruptionBudget.
podDisruptionBudget:
  enabled: false
  # Set exactly one of minAvailable / maxUnavailable; minAvailable
  # takes precedence if both are set. Accepts an integer or a
  # percentage string (e.g. "50%").
  minAvailable: 1
  maxUnavailable: ""

livenessProbe:
  path: /health/live
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  path: /health/ready
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
