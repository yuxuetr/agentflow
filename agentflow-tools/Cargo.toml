[package]
name = "agentflow-tools"
version = "0.1.0"
description = "Unified tool abstraction and built-in tools for AgentFlow agents"
keywords = ["ai", "agents", "tools", "llm"]
categories = ["development-tools"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# T3.3: the Tool contract (trait, ToolRegistry, ToolMetadata, Capability,
# ToolPolicy, SecurityProfile, the SandboxBackend trait + DTOs) lives in
# this dependency-free L0 crate; this crate re-exports it in full (see
# lib.rs) and adds the concrete builtin tools + OS-sandbox backends.
agentflow-tool = { path = "../agentflow-tool", version = "0.1" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "default-tls"] }
tracing = "0.1"
url = "2.5"
jsonschema = "0.17"
tempfile = "3"
sha2 = "0.10"
# S3.2: RLIMIT_CPU (+ RLIMIT_AS/RLIMIT_NPROC on macOS) via `setrlimit` in
# `pre_exec` — needed on every Unix target this crate builds for, so this
# is a plain dependency, not target-gated like `seccompiler`/`landlock`.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
# S3.1: path-scoped filesystem access control layered on top of the
# seccomp syscall filter (kernel >= 5.13, runtime ABI probed).
landlock = "0.4"

[dev-dependencies]
tokio-test = "0.4"
