[package]
name = "yanshi-tool"
version = "0.1.0"
description = "Tool contract for Yanshi: the Tool trait, ToolRegistry, and sandbox-status DTOs"
keywords = ["ai", "agents", "tools", "llm"]
categories = ["development-tools"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
jsonschema = { version = "0.17", default-features = false }
# `SandboxBackend::wrap_command` takes `&mut tokio::process::Command` — the
# contract trait itself references this type, so `tokio` (process only; no
# concrete backend spawns anything from this crate) is a real, non-dev
# dependency here, not just a test convenience.
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# NOTE (T3.3): deliberately does NOT dev-depend on `yanshi-tools` (which
# depends on this crate) — that cyclic dev-dependency produced two distinct
# compilations of `yanshi-tool` in the graph, so a real `ShellTool` (from
# `yanshi-tools`) failed to satisfy this crate's own `Tool` trait in its
# own tests. The two tests that needed a real `ShellTool` moved to
# `yanshi-tools/tests/registry_against_real_shell_tool.rs` instead, where
# no such cycle exists.
