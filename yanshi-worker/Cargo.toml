[package]
name = "yanshi-worker"
version = "0.1.0"
description = "Distributed worker process for Yanshi"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
yanshi-core = { path = "../yanshi-core", version = "0.2" }
# P2.8 — enable the `mcp` feature so the worker can dispatch `mcp` payloads
# via the same `MCPNode` the local scheduler uses; default features cover
# `llm` / `http` / `file` / `template`.
yanshi-nodes = { path = "../yanshi-nodes", version = "0.2" }
# Capability nodes (llm / mcp dispatch) moved to yanshi-nodes-ai (P-A split).
yanshi-nodes-ai = { path = "../yanshi-nodes-ai", version = "0.2", features = ["mcp"] }
yanshi-llm = { path = "../yanshi-llm", version = "0.2" }
yanshi-agents = { path = "../yanshi-agents", version = "0.2" }
yanshi-memory = { path = "../yanshi-memory", version = "0.1" }
yanshi-tools = { path = "../yanshi-tools", version = "0.1" }
# P-A2.3: the worker depends on the shared control-plane contract, not the
# gateway crate. (`yanshi-server` stays a dev-dependency for the gRPC
# round-trip + DistributedDagScheduler integration tests.)
yanshi-worker-proto = { path = "../yanshi-worker-proto", version = "0.1" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { workspace = true, features = ["full"] }
# Q3.1.3: jittered reconnect backoff in `run_forever` so a transient
# control-plane blip can't pin every worker to the same retry cycle.
rand = "0.8"
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Integration tests drive the real gRPC server + the distributed scheduler.
yanshi-server = { path = "../yanshi-server", version = "0.1" }
anyhow = "1"
serde_yaml = "0.9"
tonic = "0.12"
# T1.2: the TLS e2e test spawns the real compiled `yanshi-worker`
# binary (assert_cmd) against an in-process self-signed CA + server/
# client cert chain (rcgen) — no fixture cert files checked into the repo.
assert_cmd = "2.0"
predicates = "3.0"
rcgen = "0.13"
tempfile = "3"
