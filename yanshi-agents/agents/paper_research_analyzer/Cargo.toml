[package]
name = "paper-research-analyzer"
version = "0.1.0"
edition = "2021"
authors = ["Yanshi Contributors"]
description = "PDF research paper analysis agent using Yanshi"
license = "MIT"

[[bin]]
name = "paper-research-analyzer"
path = "src/main.rs"

[dependencies]
# Yanshi dependencies
yanshi-core = { path = "../../../yanshi-core" }
yanshi-llm = { path = "../../../yanshi-llm" }
yanshi-agents = { path = "../.." }
yanshi-mcp = { path = "../../../yanshi-mcp" }

# Agent-specific dependencies
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "default-tls"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"