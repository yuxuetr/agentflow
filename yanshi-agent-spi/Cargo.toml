[package]
name = "yanshi-agent-spi"
version = "0.1.0"
description = "Agent runtime contracts for Yanshi — AgentRuntime, AgentEvent, AgentStep, AgentContext"
keywords = ["ai", "agents", "runtime"]
categories = ["data-structures"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
yanshi-value = { path = "../yanshi-value", version = "0.1" }
yanshi-store-spi = { path = "../yanshi-store-spi", version = "0.1" }
# T3.3: contract-only usage (Tool/ToolRegistry/Capability/SandboxStatus) —
# depends on the contract crate directly, not the builtin-impl one.
yanshi-tool = { path = "../yanshi-tool", version = "0.1" }
async-trait = "0.1"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { workspace = true, features = ["sync"] }
# L5.1: DelegationSpec::expected_output_schema validation.
jsonschema = { version = "0.17", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
