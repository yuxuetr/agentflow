[workspace]

[package]
name = "code-reviewer-write"
version = "0.1.0"
edition = "2024"
publish = false
description = "A2 follow-up: validates Harness Mode approval gate end-to-end by wiring wrap_registry + CliApprovalProvider manually (the `yanshi harness run` CLI doesn't currently do this — see findings)"

[dependencies]
yanshi-core    = { path = "../../../yanshi-core" }
yanshi-agents  = { path = "../../../yanshi-agents" }
yanshi-llm     = { path = "../../../yanshi-llm" }
yanshi-memory  = { path = "../../../yanshi-memory" }
yanshi-tools   = { path = "../../../yanshi-tools" }
yanshi-harness = { path = "../../../yanshi-harness" }

tokio              = { version = "1", features = ["full"] }
async-trait        = "0.1"
anyhow             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy            = "0.15"

[[bin]]
name = "code-reviewer-write"
path = "src/main.rs"
