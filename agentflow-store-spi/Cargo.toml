[package]
name = "agentflow-store-spi"
version = "0.1.0"
description = "Storage contracts for AgentFlow — MemoryStore + the Message/Role/TokenCounter data types"
keywords = ["ai", "agents", "memory", "storage"]
categories = ["data-structures"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
