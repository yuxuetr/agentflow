[package]
name = "yanshi-skills"
version = "0.1.0"
description = "Skill system for Yanshi — declarative skill manifests that wire LLM persona, tools, knowledge and memory into a runnable agent"
keywords = ["ai", "agents", "skills", "llm"]
categories = ["development-tools"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
yanshi-agents  = { path = "../yanshi-agents", version = "0.2" }
# P-A4.3: the `Capability` / `Lowered` contract lives in the kernel; a Skill
# lowers to tools + context. Direct L0 dependency (capability → contract),
# independent of the `yanshi-agents` runtime crate.
yanshi-agent-spi = { path = "../yanshi-agent-spi", version = "0.1" }
yanshi-tools   = { path = "../yanshi-tools", version = "0.1" }
# Modality Tool adapters (tts/asr/text_to_image/...) — see that crate's
# module docs for why it's a separate adapter crate rather than a direct
# `yanshi-llm` dependency of `yanshi-tools` itself.
yanshi-tools-ai = { path = "../yanshi-tools-ai", version = "0.1" }
yanshi-memory  = { path = "../yanshi-memory", version = "0.1" }
# `code-chunking` (L4.1): enabled here (not just left as a library-only
# opt-in) so a skill manifest's `knowledge.chunk_strategy = "code_ast"`
# actually works end-to-end — Cargo features are compile-time, so leaving
# it off would make that manifest setting silently unusable at runtime.
yanshi-rag     = { path = "../yanshi-rag", version = "0.3.0-alpha", default-features = false, features = ["code-chunking"] }
yanshi-mcp     = { path = "../yanshi-mcp", version = "0.2" }

async-trait = "0.1"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
serde_yaml  = "0.9"
toml        = "0.8"
regex       = "1"
thiserror   = "1.0"
tokio       = { workspace = true, features = ["full"] }
tracing     = "0.1"
dirs        = "5.0"
glob        = "0.3"
semver      = "1"
sha2        = "0.10"
reqwest     = { workspace = true }
# Q1.10.1: Ed25519 verification for marketplace artifact signatures.
# Pure Rust, no native binding required. `default-features = false`
# drops the `rand_core` requirement that's only needed for key
# generation (verification only needs `VerifyingKey + Signature`).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64      = "0.21"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
tar = "0.4"
flate2 = "1.0"
