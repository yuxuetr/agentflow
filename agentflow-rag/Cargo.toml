[package]
name = "agentflow-rag"
version = "0.3.0-alpha"
description = "Retrieval-Augmented Generation (RAG) system for AgentFlow"
keywords = ["rag", "vector-database", "embeddings", "semantic-search", "ai"]
categories = ["algorithms", "database", "text-processing"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["qdrant"]
qdrant = ["dep:qdrant-client"]
local-embeddings = ["dep:ort", "dep:ndarray", "dep:tokenizers"]
pdf = ["dep:pdf-extract"]
html = ["dep:scraper"]
# L4.1: Rust-source AST-aware chunking (`ChunkingStrategy::CodeAst`). Gated
# behind a feature since `syn` is a real dependency-weight addition that
# most RAG consumers (prose/markdown corpora) never need.
code-chunking = ["dep:syn", "dep:proc-macro2"]

[dependencies]
# Kernel contracts (P-A4.1): `KnowledgeBackend` SPI implemented here, `Tool`
# contract for the `rag_search` tool. Both are L0 — capability/tool tier
# crates depend downward onto the contract kernel (RFC §3 layering).
agentflow-store-spi = { path = "../agentflow-store-spi", version = "0.1" }
agentflow-tools = { path = "../agentflow-tools", version = "0.1" }

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"

# HTTP client for API-based embeddings
reqwest = { workspace = true }

# Vector databases
qdrant-client = { version = "1.11", optional = true }

# Text processing
unicode-segmentation = "1.11"
regex = "1.10"

# Document processing
pdf-extract = { version = "0.7", optional = true }
scraper = { version = "0.19", optional = true }
csv = "1.3"

# Rust-source AST parsing for `CodeAstChunker` (`code-chunking` feature).
# `span-locations` is required to read real line numbers off `syn::Item`
# spans outside of an actual proc-macro invocation context.
syn = { version = "2.0", features = ["full"], optional = true }
proc-macro2 = { version = "1.0", features = ["span-locations"], optional = true }

# Local embeddings (optional)
ort = { version = "2.0.0-rc.10", features = ["download-binaries"], optional = true }
ndarray = { version = "0.15", optional = true }
tokenizers = { version = "0.19", optional = true, default-features = false, features = ["onig"] }

# Utilities
futures = "0.3"
uuid = { workspace = true, features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# Retry logic
tokio-retry = "0.3"

[dev-dependencies]
tempfile = "3.8"
proptest = "1.4"
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.5"

[[bench]]
name = "retrieval"
harness = false
